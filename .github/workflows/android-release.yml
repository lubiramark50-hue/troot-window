name: Troot Window Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Create ephemeral signing key
        shell: bash
        run: |
          set -e
          KEY_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v             -keystore "$PWD/troot-window-ci.keystore"             -storepass:env KEY_PASS             -keypass:env KEY_PASS             -alias "troot-window-ci"             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Troot Window, OU=Troot Window, O=Troot Window, L=Kampala, ST=Central, C=UG"
          echo "TROOT_KEYSTORE_PATH=$PWD/troot-window-ci.keystore" >> "$GITHUB_ENV"
          echo "TROOT_KEYSTORE_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "TROOT_KEY_ALIAS=troot-window-ci" >> "$GITHUB_ENV"
          echo "TROOT_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: npx cap build android

      - name: Verify signed APK
        shell: bash
        run: |
          set -e
          test -f android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: troot-window-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
