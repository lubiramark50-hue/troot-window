name: Troot Window Visual Review
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/visual-review.yml'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install frontend
        run: npm install --no-audit --no-fund
      - name: Build isolated visual-test frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ui-review-example-anon-key
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture desktop and phone and assert layouts
        run: node scripts/capture-design.mjs
      - name: Save screenshots and test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: troot-responsive-review
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
