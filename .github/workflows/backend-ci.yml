name: Troot Window Backend CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**",".github/workflows/backend-ci.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/TrootWindow.Api
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
