name: Troot Window Frontend CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Typecheck and production build
        run: npm run build
      - name: Frontend API contract smoke test
        run: npm run test:contract
