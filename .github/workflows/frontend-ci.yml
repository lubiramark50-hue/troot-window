name: Troot Window Frontend CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Frontend API contract smoke test
        run: npm run test:contract
      - name: Verify employer logos and block misleading aggregator logos
        run: npm run test:logos
      - name: Security regression checks
        run: npm run test:security
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
