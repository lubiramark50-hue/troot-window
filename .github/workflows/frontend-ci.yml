name: Troot Window Frontend CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Frontend API contract smoke test
        run: npm run test:contract
      - name: Verify employer logos and block misleading aggregator logos
        run: npm run test:logos
      - name: Verify location lookup and fallback
        run: npm run test:location
      - name: Verify branded favicons
        run: npm run test:favicon
      - name: Security regression checks
        run: npm run test:security
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Worker matching and privacy checks
        run: npm run test:workers
      - name: Install browser and test worker flows on desktop and mobile
        run: |
          npx playwright install --with-deps chromium
          npm run test:workers:e2e
      - name: Existing job browser regression
        run: |
          VITE_SUPABASE_URL=https://fake.supabase.test VITE_SUPABASE_ANON_KEY=fake-publishable-key npm run build
          node scripts/e2e-job-regression.mjs
