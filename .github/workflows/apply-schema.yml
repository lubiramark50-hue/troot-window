name: Apply Supabase schema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/supabase/schema.sql'
      - '.github/workflows/apply-schema.yml'

permissions:
  contents: read

concurrency:
  group: troot-production-schema
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that SUPABASE_DB_URL exists
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL repository secret first (Supabase > Project Settings > Database > Connection string > URI)."
            exit 1
          fi

      - name: Apply frontend/supabase/schema.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction -f frontend/supabase/schema.sql
