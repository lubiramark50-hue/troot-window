name: Apply Supabase schema (admin only)

# SUPABASE_DB_URL belongs to the job-ingestion connection and cannot run DDL.
# Database schema migrations must use a separate privileged connection and
# should only be initiated intentionally after review.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: troot-production-schema
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require migration-owner connection
        env:
          SUPABASE_MIGRATION_DB_URL: ${{ secrets.SUPABASE_MIGRATION_DB_URL }}
        run: |
          if [ -z "$SUPABASE_MIGRATION_DB_URL" ]; then
            echo "::error::Set SUPABASE_MIGRATION_DB_URL to a privileged Supabase database owner connection, or apply the reviewed SQL using the Supabase Management API. Never use the restricted ingestion SUPABASE_DB_URL."
            exit 1
          fi

      - name: Apply reviewed schema atomically
        env:
          SUPABASE_MIGRATION_DB_URL: ${{ secrets.SUPABASE_MIGRATION_DB_URL }}
        run: psql "$SUPABASE_MIGRATION_DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction -f frontend/supabase/schema.sql
