name: Deploy Troot Window review preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: troot-window-review-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build review version
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy a non-production Netlify preview
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Set NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets before running a review preview."
            exit 1
          fi
          npx --yes netlify-cli@latest deploy --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Troot Window review $GITHUB_SHA" | tee /tmp/netlify-preview.txt
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.netlify\.app' /tmp/netlify-preview.txt | tail -n 1)"
          if [ -z "$URL" ]; then
            echo "::error::Netlify did not return a recognizable preview URL. Check the deployment output above."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## Troot Window review preview"
            echo ""
            echo "Preview URL: $URL"
            echo ""
            echo "This is a non-production deploy. It was not published with the --prod flag."
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
