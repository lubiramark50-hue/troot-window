name: Troot Window browser smoke tests

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: HTTPS draft preview URL (never production)
        required: true
        type: string
        default: https://6ad4b101e5cd72ea7dbc1e69--troot-window.netlify.app

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: ${{ inputs.preview_url }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Report dependency advisories
        working-directory: frontend
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node scripts/report-npm-audit.mjs /tmp/npm-audit.json
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: troot-window-browser-smoke-screenshots
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
