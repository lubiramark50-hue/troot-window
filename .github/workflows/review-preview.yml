name: Troot Window Review Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: troot-window-review-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build review version
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy non-production Netlify preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Netlify preview secrets are missing."
            exit 1
          fi
          npx --yes netlify-cli@latest deploy --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Troot Window review preview $GITHUB_SHA" | tee /tmp/netlify-preview.txt
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.netlify\.app' /tmp/netlify-preview.txt | tail -n 1)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::No Netlify preview URL was returned."
            exit 1
          fi
          {
            echo "## Troot Window review preview"
            echo
            echo "Preview URL: $PREVIEW_URL"
            echo
            echo "This is a draft deploy. It was not published to production."
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
